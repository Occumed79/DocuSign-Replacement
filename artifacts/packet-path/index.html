<!DOCTYPE html>
<html lang="en" style="background:#060d1f;color-scheme:dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>PacketPath — Occu-Med</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html,body,#root{background:#060d1f;color-scheme:dark;margin:0;padding:0;min-height:100vh;}
      .packetpath-boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;color:#f4f7f6;}
      .packetpath-boot-card{display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.05);box-shadow:0 18px 60px rgba(0,0,0,.28);}
      .packetpath-boot-dot{width:10px;height:10px;border-radius:999px;background:#8dbeb5;box-shadow:0 0 18px rgba(141,190,181,.8);}
      .packetpath-boot-title{font-size:14px;font-weight:600;letter-spacing:.01em;}
      .packetpath-boot-subtitle{font-size:12px;opacity:.55;margin-top:3px;}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="packetpath-boot" role="status" aria-live="polite">
        <div class="packetpath-boot-card">
          <span class="packetpath-boot-dot" aria-hidden="true"></span>
          <div>
            <div class="packetpath-boot-title">Loading PacketPath…</div>
            <div class="packetpath-boot-subtitle">Starting the Occu-Med workflow application</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
