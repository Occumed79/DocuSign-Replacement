name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.28.1
        
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    # Native dependencies such as bcrypt need their install/build scripts in
    # order for the API test suite to load the same runtime used in Docker.
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Build lib references (force rebuild)
      run: pnpm exec tsc --build --force

    - name: Type check api-server
      run: pnpm --filter=@workspace/api-server run typecheck

    - name: Type check complete frontend
      run: pnpm --filter=@workspace/packet-path run typecheck
      
    - name: Run API tests
      run: pnpm --filter=@workspace/api-server run test

    # Browser downloads are large and were dominating/stalling repeated PR runs.
    # Cache the exact Playwright 1.62 browser bundle, while still installing the
    # required Ubuntu libraries on every fresh hosted runner.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-1.62.0

    - name: Install Playwright system dependencies
      timeout-minutes: 8
      run: pnpm exec playwright install-deps chromium webkit

    - name: Install Chromium and WebKit
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      timeout-minutes: 8
      run: pnpm exec playwright install chromium webkit

    # Keep critical-route smoke checks separate so a red CI step identifies the
    # exact browser + route instead of hiding six assertions in one opaque job.
    - name: Chromium — login bootstrap
      run: pnpm exec playwright test e2e/critical-routes.spec.ts --project=chromium-desktop --grep "login page mounts" --reporter=line

    - name: Chromium — exact-source signing
      run: pnpm exec playwright test e2e/critical-routes.spec.ts --project=chromium-desktop --grep "public signer recognizes" --reporter=line

    - name: Chromium — adaptive medical questionnaire
      run: pnpm exec playwright test e2e/critical-routes.spec.ts --project=chromium-desktop --grep "public medical questionnaire preserves" --reporter=line

    - name: WebKit — login bootstrap
      run: pnpm exec playwright test e2e/critical-routes.spec.ts --project=webkit-desktop --grep "login page mounts" --reporter=line

    - name: WebKit — exact-source signing
      run: pnpm exec playwright test e2e/critical-routes.spec.ts --project=webkit-desktop --grep "public signer recognizes" --reporter=line

    - name: WebKit — adaptive medical questionnaire
      run: pnpm exec playwright test e2e/critical-routes.spec.ts --project=webkit-desktop --grep "public medical questionnaire preserves" --reporter=line
