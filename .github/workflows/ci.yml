name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.28.1
        
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    # Native dependencies such as bcrypt need their install/build scripts in
    # order for the API test suite to load the same runtime used in Docker.
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Build lib references (force rebuild)
      run: pnpm exec tsc --build --force

    - name: Type check api-server
      run: pnpm --filter=@workspace/api-server run typecheck

    # The repository has older unrelated frontend type debt. Keep this feature
    # gated without making PR #116 responsible for those pre-existing files.
    - name: Type check adaptive interview frontend
      run: pnpm exec tsc -p artifacts/packet-path/tsconfig.adaptive.json --noEmit
      
    - name: Run tests
      run: pnpm --filter=@workspace/api-server run test
